# nginx.conf
worker_processes auto;

events {
    worker_connections 4096; 
}

http {
    limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;

    upstream vllm-active {
        zone llm_backend 64k;

        # 指向现有的 Docker 内置 DNS
        resolver 127.0.0.11 valid=5s ipv6=off;
        resolver_timeout 2s;

        server vllm-main:8000
               resolve
               max_fails=1
               fail_timeout=10s;

        server vllm-backup:8000
               resolve
               backup
               max_fails=1
               fail_timeout=10s;
        
        keepalive 32;
    }

   

    server {
        listen 80;

        #------ 关键1: 流式响应，关闭一切代理缓冲 --------
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;

        #------ 关键2: 长超时 (LLM生成可能要很久)
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 3s;

        #------ 关键3: HTTP/1.1 + chunked -------
        chunked_transfer_encoding on;
        proxy_http_version 1.1;
        
        #通用 header
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        #主备模型只启一个，主模型访问失败的时候，不让它自动访问备用模型
        proxy_next_upstream off;

        location /health {
            proxy_pass http://vllm-active/health;
        }

        location /metrics {
            proxy_pass http://vllm-active/metrics;

        }

        location /v1/ {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://vllm-active;
            
            error_page 503 = @ratelimited;
        }

        location @ratelimited {
            default_type application/json;
            return 503 '{"error":{"message":"rate limited, retry later","type":"rate_limit"}}';
        }
        
    }
    
    # 给 nginx-exporter 提供 nginx 服务器的状态数据
    server {
        listen 8081;
        
        location = /stub_status{
            stub_status;
            access_log off;
        }
    }
}
