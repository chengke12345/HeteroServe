global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'vllm-active'
    static_configs:
      - targets: ['vllm-active:8000']
    metrics_path: /metrics
  
  - job_name: 'dcgm-exporter'
    static_configs:
      - targets: ['dcgm-exporter:9400']

  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']